name: Build and Push ChatwootX Docker Image

on:
  push:
    branches:
      - amicitia
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional custom tag for the image (e.g., v1.0)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/amd64,linux/arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tag_step
        env:
          EVENT_NAME: ${{ github.event_name }}
          CUSTOM_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
        run: |
          TAGS="ghcr.io/${{ github.repository_owner }}/chatwootx:amiticia,ghcr.io/${{ github.repository_owner }}/chatwootx:latest-amiticia"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$CUSTOM_TAG" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository_owner }}/chatwootx:$CUSTOM_TAG"
          fi
          echo "TAGS=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag_step.outputs.TAGS }}
          cache-from: type=gha,scope=chatwootx-amiticia
          cache-to: type=gha,scope=chatwootx-amiticia,mode=max
